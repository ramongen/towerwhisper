server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;              # PTT audio

    # Terrain data (contours JSON, elevation raster) and the app bundle compress well.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/octet-stream application/javascript text/css image/svg+xml;

    location /api/ {
        proxy_pass http://api:3000;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;  # Vue routes: /, /demo
    }
}
