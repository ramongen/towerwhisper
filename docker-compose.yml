services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: towerwhisper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towerwhisper}
      POSTGRES_DB: towerwhisper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U towerwhisper']
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false # starts without .env too (Compose 2.24+)
    environment:
      DATABASE_URL: postgres://towerwhisper:${POSTGRES_PASSWORD:-towerwhisper}@db:5432/towerwhisper
      PORT: 3000
      # The whisper service below; WHISPER_URL=off in .env turns local speech-to-text off.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
    volumes:
      - audio:/app/data/audio
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health'] # not localhost: Alpine resolves it to ::1, api listens on IPv4
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Local speech-to-text (faster-whisper), always on: the voice works with no key and no .env.
  # Here on the CPU with a small model (small.en, ~0.5 GB, 2-3 s per call), which runs on any
  # machine. On a machine with an NVIDIA GPU the start scripts add docker-compose.gpu.yml,
  # which moves it to the GPU with large-v3. The model is downloaded into the whisper-models
  # volume on the first start.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_CPU_MODEL:-small.en}
      ASR_QUANTIZATION: int8
      ASR_MODEL_PATH: /models
    volumes:
      - whisper-models:/models
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    # Port taken? ./start.sh or start.cmd pick the first free one from 8080 and set WEB_PORT.
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      TW_PUBLIC_PORT: ${WEB_PORT:-8080} # for the "open http://localhost:<port>" banner
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  audio:
  whisper-models:
