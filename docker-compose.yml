services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: towerwhisper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towerwhisper}
      POSTGRES_DB: towerwhisper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U towerwhisper']
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false # starts without .env too (Compose 2.24+)
    environment:
      DATABASE_URL: postgres://towerwhisper:${POSTGRES_PASSWORD:-towerwhisper}@db:5432/towerwhisper
      PORT: 3000
    volumes:
      - audio:/app/data/audio
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 3s
      retries: 30
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports:
      - '8080:80'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  audio:
