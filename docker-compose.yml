services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: towerwhisper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towerwhisper}
      POSTGRES_DB: towerwhisper
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U towerwhisper']
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file:
      - path: .env
        required: false # starts without .env too (Compose 2.24+)
    environment:
      DATABASE_URL: postgres://towerwhisper:${POSTGRES_PASSWORD:-towerwhisper}@db:5432/towerwhisper
      PORT: 3000
    volumes:
      - audio:/app/data/audio
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health'] # not localhost: Alpine resolves it to ::1, api listens on IPv4
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Local speech-to-text: Whisper large-v3 (faster-whisper) on an NVIDIA GPU.
  # Optional: enabled with COMPOSE_PROFILES=whisper (see .env.example). The model is
  # downloaded into the whisper-models volume on the first start (~3 GB).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0-gpu
    profiles: ['whisper']
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-large-v3}
      ASR_QUANTIZATION: float16
      ASR_MODEL_PATH: /models
    volumes:
      - whisper-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Same service on the CPU, for laptops without an NVIDIA GPU. Enabled with
  # COMPOSE_PROFILES=whisper-cpu; answers on the same "whisper" host name, so WHISPER_URL
  # does not change. Use a small model here (small.en by default): large-v3 is too slow on a CPU.
  whisper-cpu:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0
    profiles: ['whisper-cpu']
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_CPU_MODEL:-small.en}
      ASR_QUANTIZATION: int8
      ASR_MODEL_PATH: /models
    volumes:
      - whisper-models:/models
    networks:
      default:
        aliases: [whisper]
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    # Port taken? ./start.sh or start.cmd pick the first free one from 8080 and set WEB_PORT.
    ports:
      - '${WEB_PORT:-8080}:80'
    environment:
      TW_PUBLIC_PORT: ${WEB_PORT:-8080} # for the "open http://localhost:<port>" banner
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  audio:
  whisper-models:
